.card-stats { display: flex; gap: 12px; margin-top: 10px; color: #64748b; font-size: 12px; }
.card-agency { margin-top: 10px; display: flex; align-items: center; gap: 6px; font-size: 11px; color: #94a3b8; }
.agency-dot { width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; }

// Seeded random for consistent data
let seed = 42;
function seededRandom() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

const ALL_LISTINGS = [];
(function generateListings() {
  const types = ['apartment','house','land','commercial'];
  const deals = ['sale','rent'];
  for (let i = 1; i <= 60; i++) {
    const type = types[i % 4];
    const deal = deals[i % 3 === 0 ? 1 : 0];
    const loc = LOCATIONS[i % LOCATIONS.length];
    const agency = AGENCIES[i % AGENCIES.length];
    const beds = type==='land'?0:type==='commercial'?0:Math.ceil(seededRandom()*4);
    const baths = type==='land'?0:type==='commercial'?Math.ceil(seededRandom()*2):Math.ceil(seededRandom()*3);
    const area = type==='land'?200+Math.floor(seededRandom()*2000):30+Math.floor(seededRandom()*250);
    const bp = type==='land'?area*(40+seededRandom()*60):type==='house'?area*(1500+seededRandom()*2500):type==='commercial'?area*(1200+seededRandom()*1800):area*(1800+seededRandom()*2200);
    const price = deal==='rent'?Math.round(bp/200/50)*50:Math.round(bp/1000)*1000;
    const titles = {
      apartment:{en:`Modern apartment in ${loc.name}`,me:`Savremen stan u ${loc.name}`,ru:`Современная квартира в ${loc.name}`},
      house:{en:`Charming house in ${loc.name}`,me:`Udobna kuća u ${loc.name}`,ru:`Уютный дом в ${loc.name}`},
      land:{en:`Building plot in ${loc.name}`,me:`Plac za gradnju u ${loc.name}`,ru:`Участок под застройку в ${loc.name}`},
      commercial:{en:`Commercial space in ${loc.name}`,me:`Poslovni prostor u ${loc.name}`,ru:`Коммерческое помещение в ${loc.name}`}
    };
    ALL_LISTINGS.push({
      id:i, type, deal, title:titles[type], location:loc.name,
      lat:loc.lat+(seededRandom()-0.5)*0.03, lng:loc.lng+(seededRandom()-0.5)*0.03,
      price, area, beds, baths, agencyId:agency.id,
      image:IMAGES[(i-1)%IMAGES.length], featured:i<=6
    });
  }
})();

// ─── HELPERS ────────────────────────────────────────────────────────────────
function fmt(n) { return n>=1000000?`€${(n/1000000).toFixed(1)}M`:n>=1000?`€${(n/1000).toFixed(0)}K`:`€${n}`; }
function t() { return T[state.lang]; }
function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function getFiltered() {
  return ALL_LISTINGS.filter(l => {
    const s = state.searchText.toLowerCase();
    if (s && !l.location.toLowerCase().includes(s) && !l.title.en.toLowerCase().includes(s)) return false;
    if (state.filters.type!=='all' && l.type!==state.filters.type) return false;
    if (state.filters.deal!=='all' && l.deal!==state.filters.deal) return false;
    if (state.filters.minPrice && l.price<Number(state.filters.minPrice)) return false;
    if (state.filters.maxPrice && l.price>Number(state.filters.maxPrice)) return false;
    if (state.filters.minArea && l.area<Number(state.filters.minArea)) return false;
    if (state.filters.maxArea && l.area>Number(state.filters.maxArea)) return false;
    if (state.filters.beds!=='any' && l.beds<Number(state.filters.beds)) return false;
    return true;
  });
}

function toggleFav(id) {
  const i = state.favorites.indexOf(id);
  if (i===-1) state.favorites.push(id); else state.favorites.splice(i,1);

function toggleComp(id) {
  const i = state.compareList.indexOf(id);
  if (i===-1 && state.compareList.length<4) state.compareList.push(id);

}

// ─── MAP (Mercator projection) ──────────────────────────────────────────────
function projectMerc(lat, lng) {
  const W=600,H=500, cx=19.0, cy=42.5, scale=12000;
  const x = W/2 + (lng-cx)*scale*Math.PI/180;
  const latRad = lat*Math.PI/180;
  const cyRad = cy*Math.PI/180;
  const y = H/2 - scale*(Math.log(Math.tan(Math.PI/4+latRad/2))-Math.log(Math.tan(Math.PI/4+cyRad/2)));
  return [x,y];
}

function renderMap(listings, selectedId) {
  const W=600,H=500;
  let svg = `<svg viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="#dbeafe"/>`;
  svg += `<text x="80" y="${H-30}" fill="#93c5fd" font-size="14" font-family="system-ui" opacity="0.7">Adriatic Sea</text>`;
  // Grid
  [18,18.5,19,19.5,20].forEach(lng => { const [x]=projectMerc(42.5,lng); svg+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="#bfdbfe" stroke-width="0.5"/>`; });
  [42,42.25,42.5,42.75,43].forEach(lat => { const [,y]=projectMerc(lat,19); svg+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#bfdbfe" stroke-width="0.5"/>`; });
  // Cities
  LOCATIONS.forEach(loc => {
    const [x,y]=projectMerc(loc.lat,loc.lng);
    svg+=`<circle cx="${x}" cy="${y}" r="3" fill="#64748b" opacity="0.3"/><text x="${x+6}" y="${y+4}" fill="#64748b" font-size="10" font-family="system-ui">${loc.name}</text>`;
  });
  // Pins
  listings.forEach(l => {
    const [x,y]=projectMerc(l.lat,l.lng);
    const sel = l.id===selectedId;
    const col = l.deal==='rent'?'#7c3aed':'#0e7490';
    svg+=`<circle cx="${x}" cy="${y}" r="${sel?10:6}" fill="${col}" opacity="${sel?1:0.8}" stroke="#fff" stroke-width="${sel?2.5:1.5}" style="cursor:pointer" onclick="setState({selectedId:${l.id}})"/>`;
    if (sel) svg+=`<text x="${x}" y="${y-14}" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="600" font-family="system-ui">${fmt(l.price)}</text>`;
  });
  svg += `</svg>`;
  return `<div class="map-container">${svg}<div class="map-legend"><span style="display:flex;align-items:center;gap:4px"><span class="map-legend-dot" style="background:#0e7490"></span> ${t().sale}</span><span style="display:flex;align-items:center;gap:4px"><span class="map-legend-dot" style="background:#7c3aed"></span> ${t().rent}</span></div></div>`;
}

        <span>${tx.email}: ${a.email}</span>
        <span>${tx.website}: ${a.website}</span>
      </div>
    </div>
    <div class="grid-3">${listings.map(l=>cardHTML(l)).join('')}</div>
  </div>`;
}

function renderFavorites() {
  const tx = t();
  const favs = ALL_LISTINGS.filter(l=>state.favorites.includes(l.id));
  return `<div class="container" style="padding-top:24px;padding-bottom:48px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px">
      <h2 style="font-size:24px;font-weight:700;margin:0">${tx.favorites} (${favs.length})</h2>
      ${favs.length>0?`<button class="btn btn-ghost" onclick="state.favorites=[];render()">${tx.clearAll}</button>`:''}
    </div>
    ${favs.length===0?`<div class="empty-state">${tx.noFavorites}</div>`:`<div class="grid-3">${favs.map(l=>cardHTML(l)).join('')}</div>`}
  </div>`;
}

function renderCompare() {
  const tx = t();
  const items = ALL_LISTINGS.filter(l=>state.compareList.includes(l.id));
  if (items.length===0) return `<div class="container" style="padding-top:24px;padding-bottom:48px">
    <h2 style="font-size:24px;font-weight:700;margin-bottom:24px">${tx.compareProp} (0/4)</h2>
    <div class="empty-state">${tx.noCompare}</div></div>`;

  const rows = [
    [tx.price, l=>`<strong>${fmt(l.price)}${l.deal==='rent'?tx.perMonth:''}</strong>`],
    [tx.type, l=>tx[l.type]],
    [tx.deal, l=>tx[l.deal]],
    [tx.location, l=>l.location],
    [tx.area, l=>`${l.area} ${tx.sqm}`],
    [tx.beds, l=>l.beds||'—'],
    [tx.baths, l=>l.baths||'—'],
    [`€/${tx.sqm}`, l=>l.area>0?`€${Math.round(l.price/l.area)}`:'—'],
    [tx.agency, l=>AGENCIES.find(a=>a.id===l.agencyId)?.name||'']
  ];

  return `<div class="container" style="padding-top:24px;padding-bottom:48px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px">
      <h2 style="font-size:24px;font-weight:700;margin:0">${tx.compareProp} (${items.length}/4)</h2>
      <button class="btn btn-ghost" onclick="state.compareList=[];render()">${tx.clearAll}</button>
    </div>
    <div style="overflow-x:auto">
      <table class="compare-table">
        <thead><tr><th>${tx.property}</th>${items.map(l=>`<th style="min-width:180px"><img class="compare-img" src="${l.image}" alt=""><div class="compare-name">${esc(l.title[state.lang])}</div></th>`).join('')}</tr></thead>
        <tbody>${rows.map(([label,fn])=>`<tr><td>${label}</td>${items.map(l=>`<td>${fn(l)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>
    </div>
  </div>`;
}

// ─── NAV ────────────────────────────────────────────────────────────────────
function renderNav() {
  const tx = t();
  const p = state.page;
  const favCount = state.favorites.length;
  const compCount = state.compareList.length;
  return `<nav class="nav">
    <div style="display:flex;align-items:center;gap:32px">
      <div class="nav-brand" onclick="setState({page:'home'})">${tx.brand}</div>
      <div class="nav-links">
        <button class="nav-link${p==='home'?' active':''}" onclick="setState({page:'home'})">${tx.home}</button>
        <button class="nav-link${p==='listings'?' active':''}" onclick="setState({page:'listings'})">${tx.search.replace('…','')}</button>
        <button class="nav-link${p==='agencies'||p==='agency'?' active':''}" onclick="setState({page:'agencies'})">${tx.agencies}</button>
        <button class="nav-link${p==='favorites'?' active':''}" onclick="setState({page:'favorites'})">${tx.favorites}${favCount>0?` (${favCount})`:''}</button>
        <button class="nav-link${p==='compare'?' active':''}" onclick="setState({page:'compare'})">${tx.compare}${compCount>0?` (${compCount})`:''}</button>
      </div>
    </div>
    <div style="display:flex;gap:4px">
      <button class="lang-btn${state.lang==='en'?' active':''}" onclick="setState({lang:'en'})">EN</button>
      <button class="lang-btn${state.lang==='me'?' active':''}" onclick="setState({lang:'me'})">ME</button>
      <button class="lang-btn${state.lang==='ru'?' active':''}" onclick="setState({lang:'ru'})">RU</button>
    </div>
  </nav>`;
}

function renderFooter() {
  const tx = t();
  return `<div class="footer"><div class="footer-brand">${tx.brand}</div><div>Montenegro's leading real estate platform — connecting buyers with trusted agencies</div><div style="margin-top:8px">© 2026 Nekretnine.me — All rights reserved</div></div>`;
}

// ─── MAIN RENDER ────────────────────────────────────────────────────────────
function render() {
  let pageHTML = '';
  switch(state.page) {
    case 'home': pageHTML = renderHome(); break;
    case 'listings': pageHTML = renderListings(); break;
    case 'detail': pageHTML = renderDetail(); break;
    case 'agencies': pageHTML = renderAgencies(); break;
    case 'agency': pageHTML = renderAgencyPage(); break;
    case 'favorites': pageHTML = renderFavorites(); break;
    case 'compare': pageHTML = renderCompare(); break;
  }
  document.getElementById('app').innerHTML = renderNav() + pageHTML + renderFooter();
  window.scrollTo(0,0);
}

// Initial render
render();
</script>
</body>
</html>
